[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-exam-server"
version = "0.1.0"
description = "Hosted API for the Oh-My-Exam question bank"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "limits>=5.8,<6",
  "Pillow>=10,<13",
  "PyJWT>=2.10,<3",
  "pymupdf>=1.24,<2",
  "pypdf>=4,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
ome-cie-alevel-downloader = "oh_my_exam.pipelines.adapters.cie_alevel.downloader.cli:main"
ome-cie-alevel-splitter = "oh_my_exam.pipelines.adapters.cie_alevel.splitter.cli:main"
ome-uat-admissions-downloader = "oh_my_exam.pipelines.adapters.uat.downloader.cli:main"
ome-uat-admissions-splitter = "oh_my_exam.pipelines.adapters.uat.splitter.cli:main"
ome-process-tmua = "oh_my_exam.pipelines.adapters.uat.tmua_pipeline:main"
ome-pat-admissions-downloader = "oh_my_exam.pipelines.adapters.pat.downloader.cli:main"
ome-pat-admissions-splitter = "oh_my_exam.pipelines.adapters.pat.splitter.cli:main"
ome-step-admissions-downloader = "oh_my_exam.pipelines.adapters.step.downloader.cli:main"
ome-step-admissions-splitter = "oh_my_exam.pipelines.adapters.step.splitter.cli:main"
ome-pack-subject = "oh_my_exam.pipelines.packaging.cli:main"
ome-build-catalog = "oh_my_exam.pipelines.packaging.global_cli:main"
ome-match-questions = "oh_my_exam.question_matching_cli:main"

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]
ocr = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "pytesseract>=0.3.10,<1",
  "rapidocr>=3,<4",
]
rate-limit-redis = [
  "limits[redis]>=5.8,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
