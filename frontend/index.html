<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Study platform powered by and more than AI"
    />
    <link rel="license" href="/IBMPlexMono-LICENSE.txt" />
    <script>
      ;(() => {
        const storageKey = 'oh-my-exam.theme'
        let theme

        try {
          theme = window.localStorage.getItem(storageKey)
        } catch {
          // Storage can be unavailable in privacy-restricted contexts.
        }

        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }

        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <title>OH-MY-EXAM — Answer Faster. Score Higher.</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
