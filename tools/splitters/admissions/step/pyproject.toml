[project]
name = "oh-my-exam-step-admissions-splitter"
version = "0.1.0"
description = "STEP question and solution geometry splitter for Oh-My-Exam."
requires-python = ">=3.11"
dependencies = [
    "onnxruntime>=1.20.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.24.0",
    "rapidocr>=3.0.0",
]

[project.scripts]
ome-step-admissions-splitter = "step_admissions_splitter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
