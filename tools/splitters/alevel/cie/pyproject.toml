[project]
name = "oh-my-exam-cie-alevel-splitter"
version = "0.1.0"
description = "Standalone CIE A-Level splitter for Oh-My-Exam."
requires-python = ">=3.11"
dependencies = [
    "oh-my-exam-cie-sources==0.1.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.24.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
gui = [
    "flet>=0.25.0",
]
ocr = [
    "pytesseract>=0.3.10",
]

[project.scripts]
ome-cie-alevel-splitter = "cie_alevel_splitter.cli:main"

[tool.setuptools.packages.find]
where = ["src/common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../../../shared/cie/src", "src/common"]
