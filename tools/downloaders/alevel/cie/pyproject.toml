[project]
name = "oh-my-exam-cie-alevel-downloader"
version = "0.1.0"
description = "Standalone CIE A-Level downloader for Oh-My-Exam."
requires-python = ">=3.11"
dependencies = [
    "oh-my-exam-cie-sources==0.1.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
gui = [
    "flet>=0.25.0",
]

[project.scripts]
ome-cie-alevel-downloader = "cie_alevel_downloader.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../../../shared/cie/src", "src"]
